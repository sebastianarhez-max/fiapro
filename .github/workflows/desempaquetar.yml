name: Desempaquetar FiaPro
on:
  push:
    paths:
      - '.github/workflows/desempaquetar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el proyecto
        run: |
          test -f FiaPro_web.zip || exit 0
          unzip -o FiaPro_web.zip -d .
          git rm -q FiaPro_web.zip
          git config user.name "Cristhian Arias"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "FiaPro: código fuente, README y despliegue en Render" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push
